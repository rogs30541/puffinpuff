appId: tw.vvlee.puffinpuff
productName: 海鸚泡芙 PuffinPuff
copyright: © 2026 VVLEE

directories:
  output: release
  buildResources: build

# 哪些檔案要進 asar / 安裝包
# v0.9.1：secrets 不再 bundle 進安裝檔（安全 — 公開發布的安裝檔曾外洩 app_secret）
#         憑證改由使用者在「設定 → OAuth 憑證」貼入（DPAPI 加密存 DB）；
#         dev 模式仍讀專案 secrets/ 資料夾（app.getAppPath() = 專案根目錄）
files:
  - out/**/*
  - package.json

# 額外資源（不進 asar，直接放在 resources/ 下，runtime 可讀）
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico

# native module / 含 binary 的依賴必須解壓出 asar 才能執行
asarUnpack:
  - node_modules/ffmpeg-static/**/*
  - node_modules/ffprobe-static/**/*
  - node_modules/sql.js/dist/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName}-${version}-Setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 海鸚泡芙 PuffinPuff
  language: 1028  # zh-TW
  warningsAsErrors: false
