appId: tw.vvlee.puffinpuff
productName: 海鸚泡芙 PuffinPuff
copyright: © 2026 VVLEE

directories:
  output: release
  buildResources: build

# 哪些檔案要進 asar / 安裝包
# v0.9.1：secrets 不再 bundle 進安裝檔（安全 — 公開發布的安裝檔曾外洩 app_secret）
#         憑證改由使用者在「設定 → OAuth 憑證」貼入（DPAPI 加密存 DB）；
#         dev 模式仍讀專案 secrets/ 資料夾（app.getAppPath() = 專案根目錄）
files:
  - out/**/*
  - package.json

# 額外資源（不進 asar，直接放在 resources/ 下，runtime 可讀）
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico

# native module / 含 binary 的依賴必須解壓出 asar 才能執行
asarUnpack:
  - node_modules/ffmpeg-static/**/*
  - node_modules/ffprobe-static/**/*
  - node_modules/sql.js/dist/**/*

# v0.10.1：自動更新（electron-updater）— GitHub Releases 當更新源
#   publish 設定讓 build 內嵌 app-update.yml（updater feed），並產 latest.yml
publish:
  provider: github
  owner: rogs30541
  repo: puffinpuff

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # v0.10.1：artifactName 改純 ASCII — GitHub Release 會把中文+空格的資產名
  #   淨化成 PuffinPuff-x.y.z-Setup.exe，latest.yml 若寫原名會 404，更新器抓不到
  artifactName: "PuffinPuff-${version}-Setup.${ext}"
  # 未簽章 build：關閉更新檔簽章驗證（否則簽章比對會擋更新）
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 海鸚泡芙 PuffinPuff
  language: 1028  # zh-TW
  warningsAsErrors: false
